<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-label="MR.C Digital Studio — High Contrast Light Mode Logo">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@800;900&amp;display=swap');</style>

    <!-- Deep sculpted obsidian-bronze gradient for high-contrast light mode -->
    <linearGradient id="g1-gold-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#141416"/>
      <stop offset="22%"  stop-color="#2E210D"/>
      <stop offset="50%"  stop-color="#6B4F17"/>
      <stop offset="78%"  stop-color="#2E210D"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>

    <!-- Refined antique bronze separator fade -->
    <linearGradient id="g1-fade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7A5B18" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#7A5B18" stop-opacity="0.8"/>
      <stop offset="50%"  stop-color="#6B4F17" stop-opacity="1.0"/>
      <stop offset="70%"  stop-color="#7A5B18" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7A5B18" stop-opacity="0"/>
    </linearGradient>

    <!-- Crisp micro-depth shadow (clean architectural emboss, zero blurry yellow glow) -->
    <filter id="f1-crisp-depth" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- ── TOP-LEFT CIRCUIT CORNER ────────────────────────────── -->
  <polyline points="15,55 15,15 55,15"     fill="none" stroke="#7A5B18" stroke-opacity="0.9" stroke-width="1.8" stroke-linecap="square"/>
  <polyline points="24,46 24,24 46,24"     fill="none" stroke="#7A5B18" stroke-opacity="0.3" stroke-width="1.2" stroke-linecap="square"/>
  <!-- Tick marks — top arm -->
  <line x1="30" y1="11" x2="30" y2="19"   stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="40" y1="11" x2="40" y2="19"   stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="50" y1="11" x2="50" y2="19"   stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <!-- Tick marks — left arm -->
  <line x1="11" y1="30" x2="19" y2="30"   stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="11" y1="40" x2="19" y2="40"   stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="11" y1="50" x2="19" y2="50"   stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <!-- Anchor circle + pad dots -->
  <circle cx="15" cy="15" r="3.5" fill="none" stroke="#7A5B18" stroke-opacity="0.95" stroke-width="1.8"/>
  <circle cx="15" cy="15" r="1.5" fill="#7A5B18" fill-opacity="0.9"/>
  <circle cx="55" cy="15" r="2.5" fill="#7A5B18" fill-opacity="0.9"/>
  <circle cx="15" cy="55" r="2.5" fill="#7A5B18" fill-opacity="0.9"/>
  <!-- Inner corner dot -->
  <circle cx="24" cy="24" r="1.5" fill="#7A5B18" fill-opacity="0.5"/>

  <!-- ── TOP-RIGHT CIRCUIT CORNER ───────────────────────────── -->
  <polyline points="545,55 545,15 505,15"  fill="none" stroke="#7A5B18" stroke-opacity="0.9" stroke-width="1.8" stroke-linecap="square"/>
  <polyline points="536,46 536,24 514,24"  fill="none" stroke="#7A5B18" stroke-opacity="0.3" stroke-width="1.2" stroke-linecap="square"/>
  <line x1="510" y1="11" x2="510" y2="19" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="520" y1="11" x2="520" y2="19" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="530" y1="11" x2="530" y2="19" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="541" y1="30" x2="549" y2="30" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="541" y1="40" x2="549" y2="40" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="541" y1="50" x2="549" y2="50" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <circle cx="545" cy="15" r="3.5" fill="none" stroke="#7A5B18" stroke-opacity="0.95" stroke-width="1.8"/>
  <circle cx="545" cy="15" r="1.5" fill="#7A5B18" fill-opacity="0.9"/>
  <circle cx="505" cy="15" r="2.5" fill="#7A5B18" fill-opacity="0.9"/>
  <circle cx="545" cy="55" r="2.5" fill="#7A5B18" fill-opacity="0.9"/>
  <circle cx="536" cy="24" r="1.5" fill="#7A5B18" fill-opacity="0.5"/>

  <!-- ── BOTTOM-LEFT CIRCUIT CORNER ─────────────────────────── -->
  <polyline points="15,145 15,185 55,185"  fill="none" stroke="#7A5B18" stroke-opacity="0.9" stroke-width="1.8" stroke-linecap="square"/>
  <polyline points="24,154 24,176 46,176"  fill="none" stroke="#7A5B18" stroke-opacity="0.3" stroke-width="1.2" stroke-linecap="square"/>
  <line x1="30" y1="181" x2="30" y2="189" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="40" y1="181" x2="40" y2="189" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="50" y1="181" x2="50" y2="189" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="11" y1="150" x2="19" y2="150" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="11" y1="160" x2="19" y2="160" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="11" y1="170" x2="19" y2="170" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <circle cx="15" cy="185" r="3.5" fill="none" stroke="#7A5B18" stroke-opacity="0.95" stroke-width="1.8"/>
  <circle cx="15" cy="185" r="1.5" fill="#7A5B18" fill-opacity="0.9"/>
  <circle cx="55" cy="185" r="2.5" fill="#7A5B18" fill-opacity="0.9"/>
  <circle cx="15" cy="145" r="2.5" fill="#7A5B18" fill-opacity="0.9"/>
  <circle cx="24" cy="176" r="1.5" fill="#7A5B18" fill-opacity="0.5"/>

  <!-- ── BOTTOM-RIGHT CIRCUIT CORNER ────────────────────────── -->
  <polyline points="545,145 545,185 505,185" fill="none" stroke="#7A5B18" stroke-opacity="0.9" stroke-width="1.8" stroke-linecap="square"/>
  <polyline points="536,154 536,176 514,176" fill="none" stroke="#7A5B18" stroke-opacity="0.3" stroke-width="1.2" stroke-linecap="square"/>
  <line x1="510" y1="181" x2="510" y2="189" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="520" y1="181" x2="520" y2="189" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="530" y1="181" x2="530" y2="189" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="541" y1="150" x2="549" y2="150" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="541" y1="160" x2="549" y2="160" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <line x1="541" y1="170" x2="549" y2="170" stroke="#7A5B18" stroke-opacity="0.75" stroke-width="1.2"/>
  <circle cx="545" cy="185" r="3.5" fill="none" stroke="#7A5B18" stroke-opacity="0.95" stroke-width="1.8"/>
  <circle cx="545" cy="185" r="1.5" fill="#7A5B18" fill-opacity="0.9"/>
  <circle cx="505" cy="185" r="2.5" fill="#7A5B18" fill-opacity="0.9"/>
  <circle cx="545" cy="145" r="2.5" fill="#7A5B18" fill-opacity="0.9"/>
  <circle cx="536" cy="176" r="1.5" fill="#7A5B18" fill-opacity="0.5"/>

  <!-- ── MAIN WORDMARK ──────────────────────────────────────── -->
  <text x="280" y="117"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="90" font-weight="900"
        text-anchor="middle"
        fill="url(#g1-gold-light)"
        filter="url(#f1-crisp-depth)"
        letter-spacing="-3">MR.C</text>

  <!-- Separator — widened to frame larger subtitle -->
  <line x1="130" y1="136" x2="430" y2="136" stroke="url(#g1-fade-light)" stroke-width="1.2"/>
  <!-- Centre diamond on separator -->
  <polygon points="280,130 284.5,136 280,142 275.5,136" fill="#7A5B18"/>

  <!-- Subtitle — deep crisp obsidian ink with generous letter-spacing -->
  <text x="280" y="165"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="22" font-weight="800"
        text-anchor="middle"
        fill="#1A1A1E"
        letter-spacing="4.5">DIGITAL STUDIO</text>
</svg>
